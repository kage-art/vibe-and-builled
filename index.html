<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./medbridge-logo.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#00a8cc" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MedBridge — Bridging the gap in healthcare. Seamlessly connecting patients, providers, and data to simplify access and optimize care delivery." />
    <meta name="keywords" content="MedBridge, healthcare access, doctor appointment, specialist discovery, student counseling, medicine radar, digital health" />
    
    <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <title>MedBridge — Bridging The Gap In Healthcare</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('./sw.js').then(function(reg) {
            console.log('MedBridge Service Worker registered successfully:', reg.scope);
          }).catch(function(err) {
            console.log('MedBridge Service Worker registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
